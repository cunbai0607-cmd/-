<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>iPhone 17 Pro · 网页手机模拟器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --frame: #bbb8b1;
      --frame-edge: #706f6b;
      --text: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 49%, #28282d 0, #151518 38%, #09090b 76%),
        #09090b;
    }

    button { font: inherit; color: inherit; }

    .stage {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      perspective: 1300px;
      padding: 26px;
    }

    :fullscreen .stage {
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      padding: 0;
      perspective: none;
    }

    :fullscreen .phone {
      width: 100vw;
      height: 100svh;
      max-height: none;
      min-width: 0;
      aspect-ratio: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #07080e;
      box-shadow: none;
      transform: none;
    }

    :fullscreen .phone::before,
    :fullscreen .side-button,
    :fullscreen .power-button { display: none; }
    :fullscreen .screen { border-radius: 0; }

    .phone {
      position: relative;
      width: min(390px, calc((100svh - 48px) * .462));
      aspect-ratio: 402 / 874;
      min-width: 290px;
      max-height: calc(100svh - 34px);
      padding: 9px;
      border: 1px solid #e8e4d8;
      border-radius: 58px;
      background:
        linear-gradient(118deg, #f8f6ee 0%, #96948e 5%, #e8e5dc 8%, #a9a69f 11%, #cfccc4 48%, #777671 91%, #e3e0d7 96%, #8d8a84 100%);
      box-shadow:
        0 0 0 1px #343431,
        0 0 0 3px #62615c,
        0 34px 100px #000b,
        0 12px 30px #0009,
        inset 0 0 0 1px #fff8;
      transform: rotateX(1deg);
    }

    .phone::before {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 3px;
      border-radius: 55px;
      border: 1px solid #fff3;
      pointer-events: none;
    }

    .side-button {
      position: absolute;
      z-index: 1;
      width: 3px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(90deg, #565550, #dedbd2, #777670);
      left: -4px;
      box-shadow: -1px 0 1px #fff5;
    }
    .action-button { top: 134px; height: 29px; }
    .volume-up { top: 190px; height: 53px; }
    .volume-down { top: 258px; height: 53px; }
    .power-button {
      position: absolute;
      z-index: 1;
      width: 3px;
      height: 81px;
      right: -4px;
      top: 210px;
      border-radius: 0 5px 5px 0;
      background: linear-gradient(90deg, #e1ded5, #65645f, #a7a49d);
    }

    .screen {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 49px;
      background: #07080e;
      box-shadow: inset 0 0 0 1px #000;
      touch-action: manipulation;
    }

    .wallpaper {
      position: absolute;
      z-index: -2;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 53% 44%, #f6a0ad 0%, #de6486 16%, #a42b71 34%, transparent 58%),
        radial-gradient(ellipse at 79% 26%, #66d8e6 0%, #158aab 18%, transparent 45%),
        radial-gradient(ellipse at 24% 76%, #e9b64d 0%, #c24e37 19%, transparent 50%),
        linear-gradient(146deg, #111e3c 3%, #172d4a 36%, #432251 67%, #081427 100%);
      filter: saturate(1.09);
      transition: filter .6s ease, transform .8s ease;
    }

    .wallpaper::before, .wallpaper::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 55%;
      left: -10%;
      top: 32%;
      border-radius: 50%;
      filter: blur(26px);
      transform: rotate(-24deg);
      background: linear-gradient(90deg, transparent, #ffcc8966 24%, #ff8492b5 45%, #6df4e9a1 70%, transparent);
    }
    .wallpaper::after {
      top: 52%;
      left: -18%;
      transform: rotate(25deg);
      opacity: .8;
      filter: blur(44px);
      background: linear-gradient(90deg, transparent, #f783a4c9 32%, #ffc86c99 63%, transparent);
    }

    .screen::after {
      content: "";
      position: absolute;
      z-index: 8;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, #fff1 0%, transparent 23%, transparent 76%, #0002);
      border-radius: inherit;
    }

    .status-bar {
      position: absolute;
      z-index: 12;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.3px;
      text-shadow: 0 1px 5px #0007;
      pointer-events: none;
    }

    .status-right { display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .status-right svg { display: block; }
    .status-right button { pointer-events: auto; }
    .fullscreen-toggle {
      width: 25px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }

    .island {
      position: absolute;
      z-index: 15;
      top: 11px;
      left: 50%;
      width: 124px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 24px;
      background: #000;
      box-shadow: 0 0 0 1px #ffffff08;
      transition: width .35s ease, height .35s ease, top .35s ease;
      cursor: pointer;
    }
    .island.expanded { width: 250px; height: 74px; top: 10px; }
    .camera-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      right: 12px;
      top: 13px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #26384b, #07090d 72%);
      box-shadow: inset 0 0 0 1px #19202c;
      transition: opacity .2s;
    }
    .island.expanded .camera-dot { opacity: 0; }
    .island-content { display: none; }
    .island.expanded .island-content {
      display: flex;
      height: 100%;
      padding: 12px 17px;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #ddd;
    }
    .island-art { font-size: 24px; }
    .island-wave { color: #9c79ed; letter-spacing: 2px; font-size: 15px; }

    .view {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: scale(1.025);
      transition: opacity .24s ease, transform .3s ease, visibility .24s;
    }
    .view.active { opacity: 1; visibility: visible; transform: scale(1); }

    .lock-screen {
      text-align: center;
      padding-top: 88px;
      cursor: pointer;
    }
    .lock-date { font-size: 16px; font-weight: 550; letter-spacing: .2px; }
    .lock-clock {
      margin-top: 1px;
      font-size: clamp(74px, 23vw, 102px);
      line-height: 1.12;
      font-weight: 300;
      letter-spacing: -7px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 24px #0002;
    }
    .lock-widgets {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin: 12px auto 0;
    }
    .weather-widget {
      width: 144px;
      height: 63px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #17192b51;
      backdrop-filter: blur(18px);
      font-size: 12px;
      text-align: left;
      box-shadow: inset 0 0 0 1px #ffffff0d;
    }
    .weather-icon { font-size: 27px; }
    .weather-temp { font-size: 22px; font-weight: 500; }
    .lock-hint {
      position: absolute;
      bottom: 94px;
      width: 100%;
      font-size: 13px;
      color: #ffffffce;
      text-shadow: 0 1px 8px #000;
      animation: hint 2s ease-in-out infinite;
    }
    @keyframes hint { 50% { opacity: .58; } }
    .lock-controls {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
    }
    .round-control {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid #ffffff3b;
      background: #16172060;
      backdrop-filter: blur(14px);
      cursor: pointer;
      font-size: 20px;
      transition: background .2s, transform .2s;
    }
    .round-control:hover { background: #ffffff35; transform: scale(1.07); }

    .home-screen { padding: 70px 20px 34px; }
    .home-pages {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }
    .home-page {
      position: absolute;
      inset: 0;
      width: 100%;
      transform: translateX(100%);
      transition: transform .32s cubic-bezier(.22,.75,.25,1);
    }
    .home-page.active { transform: translateX(0); }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 13px;
      row-gap: 21px;
    }
    .app-button {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-shadow: 0 1px 6px #0009;
      transition: transform .18s ease;
    }
    .app-button:active { transform: scale(.88); }
    .app-icon {
      width: 57px;
      height: 57px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 4px 11px #0005, inset 0 0 0 1px #ffffff19;
      font-size: 29px;
      text-shadow: none;
      position: relative;
    }
    .app-name { width: 67px; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .calendar-icon { background: #f8f8fb; color: #202027; font-size: 10px; font-weight: 700; }
    .calendar-icon b { font-size: 25px; line-height: 24px; color: #e64947; font-weight: 400; }
    .photos-icon { background: #fff; font-size: 31px; }
    .camera-icon { background: linear-gradient(145deg, #515663, #18191c); font-size: 31px; }
    .maps-icon { background: linear-gradient(140deg, #bce7bc, #fff 47%, #f3d9b2); }
    .clock-icon { background: #121319; font-size: 32px; border: 2px solid #303139; }
    .weather-icon-app { background: linear-gradient(145deg, #61bafa, #4776d5); }
    .settings-icon { background: linear-gradient(145deg, #c8cbd1, #727780); }
    .store-icon { background: linear-gradient(145deg, #4db5ff, #2663ce); }
    .notes-icon { background: linear-gradient(#fff 0 27%, #ffdf57 27% 100%); color: #333; font-size: 27px; }
    .health-icon { background: #fff; color: #f05462; font-size: 33px; }
    .wallet-icon { background: linear-gradient(145deg, #424a56, #161a21); }
    .wuliao-icon { background: linear-gradient(145deg, #a4f0ce, #43c890); font-size: 32px; }
    .home-indicator {
      position: absolute;
      z-index: 18;
      bottom: 8px;
      left: 50%;
      width: 135px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: width .2s, background .2s;
    }
    .home-indicator:hover { width: 145px; }
    .page-dots {
      position: absolute;
      z-index: 2;
      bottom: 101px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .page-dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #ffffff80;
      cursor: pointer;
    }
    .page-dot.active { background: #fff; }
    .dock {
      position: absolute;
      bottom: 24px;
      left: 13px;
      right: 13px;
      height: 82px;
      padding: 10px 12px;
      border-radius: 27px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      background: #ffffff27;
      backdrop-filter: blur(26px) saturate(1.5);
      box-shadow: inset 0 0 0 1px #ffffff20;
    }
    .dock .app-button { gap: 0; }
    .dock .app-icon { width: 56px; height: 56px; }
    .dock .app-name { display: none; }
    .badge {
      position: absolute;
      top: -4px;
      right: calc(50% - 33px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border: 1.5px solid #f5f5f7;
      border-radius: 10px;
      background: #ff3b30;
      color: white;
      font-size: 10px;
      text-shadow: none;
    }

    .app-view {
      position: absolute;
      z-index: 10;
      inset: 0;
      background: #f5f5f7;
      color: #111;
      transform: translateY(105%);
      transition: transform .42s cubic-bezier(.22,.8,.25,1);
      overflow: auto;
      scrollbar-width: none;
    }
    .app-view::-webkit-scrollbar { display: none; }
    .app-view.open { transform: translateY(0); }
    .wuliao-app { overflow: hidden; background: #f3f5f4; }
    .wu-root { position: absolute; inset: 0; display: flex; flex-direction: column; color: #202321; }
    .wu-header {
      z-index: 2;
      flex: 0 0 auto;
      height: 94px;
      padding: 49px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8faf9;
      border-bottom: 1px solid #e8ebe9;
    }
    .wu-header h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .wu-header-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #252a27;
      font-size: 24px;
      cursor: pointer;
    }
    .wu-list { flex: 1; overflow: auto; background: #fff; }
    .wu-contact {
      width: 100%;
      min-height: 76px;
      padding: 11px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid #f0f1f0;
      background: #fff;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .wu-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #ffd89b, #f3a34f);
      font-size: 29px;
    }
    .wu-contact-copy { min-width: 0; flex: 1; }
    .wu-contact-title { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
    .wu-contact-title time { flex: 0 0 auto; color: #9a9e9b; font-size: 11px; }
    .wu-preview { margin-top: 6px; overflow: hidden; color: #979b98; font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
    .wu-discover { flex: 1; overflow: auto; padding: 14px; background: #f3f5f4; }
    .wu-moments-link {
      width: 100%;
      min-height: 84px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #202321;
      text-align: left;
      cursor: pointer;
    }
    .wu-moments-link .wu-avatar { width: 54px; height: 54px; }
    .wu-moments-link-copy { min-width: 0; flex: 1; }
    .wu-moments-link-copy b, .wu-moments-link-copy span { display: block; }
    .wu-moments-link-copy span { margin-top: 5px; color: #929793; font-size: 12px; }
    .wu-moments-feed { flex: 1; overflow: auto; background: #f5f6f5; }
    .wu-avatar-photo { overflow: hidden; padding: 0; border: 0; cursor: pointer; }
    .wu-avatar-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .wu-contact-list { flex: 1; overflow: auto; background: #fff; }
    .wu-contact-description { margin-top: 5px; overflow: hidden; color: #979b98; font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
    .wu-cover {
      position: relative;
      height: 150px;
      padding: 16px;
      display: flex;
      align-items: flex-end;
      background:
        linear-gradient(0deg, #0008, transparent 70%),
        radial-gradient(ellipse at 75% 38%, #e6ba89, transparent 35%),
        linear-gradient(140deg, #516854, #a4a481 55%, #3b5250);
      color: #fff;
    }
    .wu-cover-profile { display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 5px #0009; }
    .wu-cover-profile .wu-avatar { border: 2px solid #fff; }
    .wu-cover-profile .wu-avatar-photo { border: 2px solid #fff; }
    .wu-post { padding: 16px 14px; border-bottom: 1px solid #e8ebe8; background: #fff; }
    .wu-post-top { display: flex; align-items: center; gap: 10px; }
    .wu-post-top .wu-avatar { width: 40px; height: 40px; font-size: 24px; }
    .wu-post-author { color: #515fb1; font-size: 14px; font-weight: 650; }
    .wu-post-time { margin-top: 4px; color: #999e9a; font-size: 11px; }
    .wu-post-copy { margin: 11px 0; color: #282d29; font-size: 14px; line-height: 1.65; white-space: pre-line; }
    .wu-post-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 9px 0; }
    .wu-post-photos img { display: block; width: 100%; aspect-ratio: 1; border-radius: 3px; background: #e6e9e6; object-fit: cover; }
    .wu-post-photo-single { display: block; width: min(220px, 62vw); aspect-ratio: 1; margin: 9px 0; border-radius: 4px; background: #e6e9e6; object-fit: cover; }
    .wu-post-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 9px; }
    .wu-like-button {
      min-width: 36px;
      height: 27px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      background: #eef0ef;
      color: #59615b;
      cursor: pointer;
    }
    .wu-like-button.liked { background: #e7f6eb; color: #229a54; }
    .wu-social { padding: 9px 10px; border-radius: 5px; background: #f4f6f4; color: #5b65a3; font-size: 12px; line-height: 1.65; }
    .wu-likers { font-weight: 550; }
    .wu-comment { color: #454a46; }
    .wu-comment b { color: #5965a6; font-weight: 550; }
    .wu-moments-blank { padding: 22px 10px; color: #8d938e; text-align: center; font-size: 12px; }
    .wu-profile-page, .wu-wallet-page, .wu-contacts-page { flex: 1; overflow: auto; background: #f3f5f4; }
    .wu-profile-banner {
      min-height: 156px;
      padding: 30px 20px 24px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fff;
    }
    .wu-profile-avatar {
      width: 66px;
      height: 66px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, #f8d7b4, #dfa16b);
      font-size: 38px;
    }
    .wu-profile-copy { min-width: 0; flex: 1; }
    .wu-profile-copy strong { display: block; font-size: 20px; }
    .wu-profile-copy span { display: block; margin-top: 7px; color: #898e8b; font-size: 12px; }
    .wu-profile-chevron { color: #a4a8a5; font-size: 22px; }
    .wu-profile-section { margin-top: 11px; background: #fff; }
    .wu-profile-row {
      width: 100%;
      min-height: 54px;
      padding: 0 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid #f0f1f0;
      background: #fff;
      color: #282c29;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .wu-profile-row:last-child { border-bottom: 0; }
    .wu-profile-row-icon { width: 23px; color: #37a66c; text-align: center; font-size: 18px; }
    .wu-profile-row-note { margin-left: auto; color: #a4a8a5; font-size: 12px; }
    .wu-friend-profile { flex: 1; overflow: auto; padding-bottom: 12px; background: #f3f5f4; }
    .wu-friend-hero { position: relative; min-height: 204px; padding: 80px 17px 17px; display: flex; align-items: flex-end; gap: 13px; background: linear-gradient(0deg,#18251dcc,transparent 70%), linear-gradient(135deg,#9ac7ae,#f2d9bd 55%,#c9dae5); color: #fff; }
    .wu-friend-hero .wu-avatar-photo { width: 66px; height: 66px; border: 2px solid #fff; border-radius: 10px; }
    .wu-friend-name { padding-bottom: 5px; font-size: 21px; font-weight: 650; text-shadow: 0 1px 4px #0006; }
    .wu-friend-facts { margin-top: 11px; padding: 14px 16px; background: #fff; color: #5b615c; font-size: 12px; line-height: 1.7; }
    .wu-friend-section { margin-top: 11px; padding: 14px 15px; background: #fff; }
    .wu-friend-section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; font-size: 14px; font-weight: 600; }
    .wu-friend-moment-previews { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .wu-friend-moment-preview { display: block; width: 100%; aspect-ratio: 1; padding: 0; overflow: hidden; border: 0; border-radius: 4px; background: #e6e9e6; cursor: pointer; }

        wuOtp = "";
        $("#wuRoot").innerHTML = `<main class="wu-login"><section class="wu-login-card"><div class="wu-login-icon" aria-hidden="true">😺</div><h3>登录吴聊</h3><p>使用默认账号通过验证码登录</p><div class="wu-account">账号：<strong>一个匿名的人</strong></div><form id="wuLoginForm"><input class="wu-code-input" id="wuOtpInput" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-label="六位验证码" placeholder="输入验证码"><button class="wu-auth-button" type="submit">验证码登录</button><button class="wu-auth-button secondary" type="button" id="wuRequestOtp">获取验证码</button></form><p class="wu-login-status" id="wuLoginStatus" role="status" aria-live="polite"></p><p class="wu-demo-note">本地演示：验证码仅显示在此页面，不会发送真实短信，也不是安全验证。</p></section></main>`;
        $("#wuRequestOtp").addEventListener("click", () => {
          let nextOtp = String(Math.floor(Math.random() * 900000) + 100000);
          if (nextOtp === previousWuOtp) {
            const previousNumber = Number(nextOtp);
            nextOtp = String(previousNumber === 999999 ? 100000 : previousNumber + 1);
          }
          previousWuOtp = nextOtp;
          wuOtp = nextOtp;
          $("#wuOtpInput").value = "";
          $("#wuLoginStatus").textContent = "已生成本地演示验证码，请查看弹窗。";

          $("#wuRoot").querySelector(".wu-code-overlay")?.remove();
          const overlay = document.createElement("div");
          overlay.className = "wu-code-overlay";
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-modal", "true");
          overlay.setAttribute("aria-label", "演示验证码");

          overlay.querySelector(".wu-code-value").textContent = wuOtp;
          $("#wuRoot").append(overlay);
          overlay.querySelector(".wu-close-code").addEventListener("click", () => overlay.remove());
          overlay.querySelector(".wu-copy-code").addEventListener("click", async () => {
            const copyStatus = overlay.querySelector(".wu-code-countdown");
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(wuOtp);
              } else {
                const temporaryInput = document.createElement("textarea");
                temporaryInput.value = wuOtp;
                temporaryInput.setAttribute("readonly", "");
                temporaryInput.style.position = "fixed";
                temporaryInput.style.opacity = "0";
                document.body.append(temporaryInput);
                temporaryInput.select();
                const copied = document.execCommand("copy");
                temporaryInput.remove();
                if (!copied) throw new Error("浏览器未允许复制");
              }
              copyStatus.textContent = "已复制。弹窗会保持打开；关闭后输入验证码即可登录。";
            } catch (error) {
              copyStatus.textContent = "复制失败，请手动输入弹窗中的验证码。";
            }
          });
        });
        $("#wuLoginForm").addEventListener("submit", (event) => {

          const status = $("#wuLoginStatus");
          if (!wuOtp) {

          wuLoggedIn = true;
          wuOtp = "";
          renderWuList();
        });
      }

      function pickRandom(items, count) {
        const shuffled = [...items];
        for (let index = shuffled.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled.slice(0, count);
      }

      function appendWuPost(container, post, index, contactName) {
        const article = document.createElement("article");
        article.className = "wu-post";
        article.dataset.postIndex = String(index);
        const top = document.createElement("div");
        top.className = "wu-post-top";
        const avatar = makeWuAvatar(contactName);
        const author = document.createElement("div");
        const authorName = document.createElement("div");
        authorName.className = "wu-post-author";
        authorName.textContent = contactName;
        const postTime = document.createElement("div");
        postTime.className = "wu-post-time";
        postTime.textContent = ["刚刚", "1小时前", "昨天 23:18", "昨天 19:42", "周一", "周日", "上周"][index % 7];
        author.append(authorName, postTime);
        top.append(avatar, author);
        article.append(top);

        const copy = document.createElement("p");
        copy.className = "wu-post-copy";
        copy.textContent = post.text;
        article.append(copy);
        const image = document.createElement("img");
        image.className = "wu-post-photo-single";
        image.src = encodeURI(`${post.photoFolder || "小清纯照片"}/${post.photo}.png`);
        image.alt = `${contactName}的朋友圈照片`;
        image.loading = "lazy";
        if (post.photo) article.append(image);

        const names = pickRandom(momentNames, 5 + Math.floor(Math.random() * 6));
        const social = document.createElement("div");
        social.className = "wu-social";
        const likers = document.createElement("div");
        likers.className = "wu-likers";
        likers.dataset.names = names.join("、");
        likers.textContent = `♥ ${names.join("、")}`;
        social.append(likers);
        const comments = pickRandom(post.comments, 2 + Math.floor(Math.random() * 2));
        const commenters = pickRandom(momentNames.filter((name) => !names.includes(name)), comments.length);
        comments.forEach((text, commentIndex) => {
          const comment = document.createElement("div");
          comment.className = "wu-comment";
          const person = document.createElement("b");
          person.textContent = `${commenters[commentIndex]}：`;
          comment.append(person, document.createTextNode(text));
          social.append(comment);
        });
        article.append(social);
        const actions = document.createElement("div");
        actions.className = "wu-post-actions";
        const likeButton = document.createElement("button");
        likeButton.className = "wu-like-button";
        likeButton.type = "button";
        likeButton.textContent = "♡";
        likeButton.setAttribute("aria-label", "赞");
        likeButton.addEventListener("click", () => {
          const liked = likeButton.classList.toggle("liked");
          likeButton.textContent = liked ? "♥ 已赞" : "♡";
        });
        actions.append(likeButton);
        article.append(actions);
        container.append(article);
      }

      function appendWuMessage(container, message, contactName = "crush") {
        if (message.storyEnding) {
          const ending = document.createElement("div");
          ending.className = "wu-deleted-ending";
          ending.setAttribute("role", "status");
          const icon = document.createElement("span");
          icon.className = "wu-deleted-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = "!";
          const copy = document.createElement("span");
          const title = document.createElement("strong");
          title.textContent = `结局${message.endingNumber}`;
          const description = document.createElement("span");
          description.textContent = message.text;
          copy.append(title, document.createElement("br"), description);
          ending.append(icon, copy);
          container.append(ending);
          return;
        }
        if (message.time) {
          const time = document.createElement("div");
          time.className = "wu-message-time";
          time.textContent = message.time;
          container.append(time);
          return;
        }
        const row = document.createElement("div");
        row.className = `wu-message${message.outgoing ? " outgoing" : ""}`;
        const avatar = message.outgoing ? document.createElement("span") : makeWuAvatar(contactName);
        if (message.outgoing) {
          avatar.className = "wu-avatar";
          avatar.setAttribute("role", "img");
          avatar.setAttribute("aria-label", "我的头像");
          avatar.textContent = "🙂";
        }
        const bubble = document.createElement("div");
        bubble.className = "wu-bubble";
        if (message.transfer) {
          bubble.className = "wu-transfer";
          const main = document.createElement("div");
          main.className = "wu-transfer-main";
          const icon = document.createElement("span");
          icon.className = "wu-transfer-icon";
          icon.textContent = "¥";
          const details = document.createElement("div");
          const amount = document.createElement("div");
          amount.className = "wu-transfer-amount";
          amount.textContent = `¥${message.transfer.amount.toFixed(2)}`;
          const note = document.createElement("div");
          note.className = "wu-transfer-note";
          note.textContent = message.transfer.note;
          details.append(amount, note);
          main.append(icon, details);
          const footer = document.createElement("div");
          footer.className = "wu-transfer-footer";
          footer.textContent = message.transfer.status
            ? `吴聊转账 · ${message.transfer.status} · 本地演示`
            : "吴聊转账 · 本地演示";
          bubble.append(main, footer);
        } else if (message.audioPath) {
          bubble.className = "wu-bubble wu-audio-bubble";
          const playButton = document.createElement("button");
          playButton.className = "wu-audio-button";
          playButton.type = "button";
          playButton.setAttribute("aria-label", "播放语音消息");
          const icon = document.createElement("span");
          icon.className = "wu-audio-icon";
          icon.textContent = "◖";
          const duration = document.createElement("span");
          duration.className = "wu-audio-duration";
          duration.textContent = "…″";
          const audio = document.createElement("audio");
          audio.preload = "metadata";
          audio.src = new URL(message.audioPath.split("/").map(encodeURIComponent).join("/"), document.baseURI).href;
          audio.addEventListener("error", () => {
            icon.textContent = "!";
            playButton.setAttribute("aria-label", `语音文件无法读取：${audio.error?.message || "请检查音频文件路径"}`);
          });
          audio.addEventListener("loadedmetadata", () => {
            if (Number.isFinite(audio.duration)) {
              const seconds = Math.max(1, Math.ceil(audio.duration));
              duration.textContent = `${seconds}″`;
              bubble.style.setProperty("--wu-audio-width", `${Math.min(190, 72 + seconds * 7)}px`);
              playButton.setAttribute("aria-label", `播放 ${seconds} 秒语音消息`);
            }
          });
          const resetPlayback = () => { icon.textContent = "◖"; };
          audio.addEventListener("ended", resetPlayback);
          audio.addEventListener("pause", resetPlayback);
          playButton.addEventListener("click", () => {
            if (audio.paused) {
              const playback = audio.play();
              if (!playback) {
                icon.textContent = "♫";
                return;
              }
              playback.then(() => {
                icon.textContent = "♫";
                playButton.setAttribute("aria-label", "暂停语音消息");
              }).catch((error) => {
                icon.textContent = "!";
                playButton.setAttribute("aria-label", `语音播放失败：${error.message}`);
              });
            } else {
              audio.pause();
            }
          });
          playButton.append(icon, duration);
          bubble.append(playButton, audio);
        } else if (message.image || message.imagePath) {
          const image = document.createElement("img");
          image.className = "wu-chat-photo";
          image.src = encodeURI(message.imagePath || `小清纯照片/${message.image}.png`);
          image.alt = message.imageAlt || (message.imagePath ? `${contactName}分享的照片` : `${contactName}分享的照片 ${message.image}`);
          image.loading = "lazy";
          bubble.append(image);
        } else {
          bubble.textContent = message.text;
        }
        row.append(avatar, bubble);
        container.append(row);
      }

      function openWuCrushTransfer(messageList, thread, input) {
        const overlay = document.createElement("section");
        overlay.className = "wu-transfer-overlay";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-label", "转账给crush");
        overlay.innerHTML = `<header class="wu-transfer-page-header"><button class="wu-transfer-page-back" type="button" aria-label="返回聊天">‹</button><strong>转账</strong><span style="width:34px"></span></header><main class="wu-transfer-page-body"><p class="wu-transfer-demo-note">本地演示转账，不会扣除真实资金或执行真实支付。</p><div class="wu-transfer-recipient">转账给 <strong>crush</strong><small>仅用于本地聊天剧情</small></div><section class="wu-transfer-entry"><label for="wuTransferAmount">转账金额</label><input class="wu-transfer-amount-input" id="wuTransferAmount" type="number" inputmode="decimal" min="0.01" max="${wuWalletBalance}" step="0.01" placeholder="0.00"><div class="wu-transfer-balance">零钱余额：¥${wuWalletBalance.toLocaleString("zh-CN")}</div><p class="wu-transfer-error" id="wuTransferError" role="status" aria-live="polite"></p><button class="wu-transfer-pay" id="wuTransferPay" type="button" disabled>扫脸免密支付（演示）</button></section><p class="wu-transfer-available">演示余额 ¥912,678.00　·　单笔上限 ¥912,678.00<br>免密确认仅为剧情模拟，不会调用摄像头或生物识别。</p><p class="wu-transfer-special-note">试试特殊数字520/1314.</p></main>`;
        $("#wuRoot").append(overlay);
        const amountInput = overlay.querySelector("#wuTransferAmount");
        const error = overlay.querySelector("#wuTransferError");
        const payButton = overlay.querySelector("#wuTransferPay");
        const validateAmount = () => {
          const value = amountInput.value.trim();
          const amount = Number(value);
          const validFormat = /^\d{1,6}(?:\.\d{1,2})?$/.test(value);
          if (!value) {
            error.textContent = "";
            payButton.disabled = true;
            return null;
          }
          if (!validFormat || !Number.isFinite(amount) || amount <= 0) {
            error.textContent = "请输入大于 0 且最多两位小数的金额。";
            payButton.disabled = true;
            return null;
          }
          if (amount > 912678 || amount > wuWalletBalance) {
            error.textContent = `金额不能超过可用余额 ¥${wuWalletBalance.toLocaleString("zh-CN")}。`;
            payButton.disabled = true;
            return null;
          }
          error.textContent = "";
          payButton.disabled = false;
          return amount;
        };
        amountInput.addEventListener("input", validateAmount);
        overlay.querySelector(".wu-transfer-page-back").addEventListener("click", () => {
          overlay.remove();
          wuCrushStoryPhase = "choice";
          input.placeholder = "选择上方的回复继续对话";
          renderWuStoryChoices(messageList, thread, input, [
            { label: "老吴", action: "voice" },
            { label: "把钱都给crush", action: "transfer" }
          ]);
        });
        payButton.addEventListener("click", async () => {
          const amount = validateAmount();
          if (amount === null) return;
          payButton.disabled = true;
          payButton.textContent = "扫脸确认中…";
          await new Promise((resolve) => window.setTimeout(resolve, 600));
          wuWalletBalance = Math.round((wuWalletBalance - amount) * 100) / 100;
          overlay.remove();
          appendWuStoryMessage(messageList, thread, {
            transfer: { amount, note: "转账给 crush", status: "支付成功" },
            outgoing: true
          });
          await handleWuCrushTransferReply(amount, messageList, thread, input);
        });
        amountInput.focus();
      }

          await waitForWuStoryMessage();
          appendWuStoryMessage(messageList, thread, { audioPath: pickWuAudioPath(), outgoing: false });

            outgoing: false
          });
          showWuCrushVoiceChoices(messageList, thread, input);

        }
        if (amount === 520 || amount === 1314) {
          await waitForWuStoryMessage();
          appendWuStoryMessage(messageList, thread, {
            transfer: { amount, note: "crush已领取", status: "已领取" },
            outgoing: false
          });
          await waitForWuStoryMessage();
          appendWuStoryMessage(messageList, thread, {
            text: "这个是给我的吗？🥺",
            outgoing: false
          });
          await waitForWuStoryMessage();
          appendWuStoryMessage(messageList, thread, {
            imagePath: "小清纯聊天/喵喵市到人类市机票.svg",
            imageAlt: "从喵喵市飞往人类市的机票截图",
            outgoing: false
          });
          await waitForWuStoryMessage();
          appendWuStoryMessage(messageList, thread, {
            text: "终于攒够去找你的钱啦",
            outgoing: false
          });
          endWuCrushStory(messageList, thread, input, 3, "crush原来也喜欢我吗！老吴");

      function startGesture(event) {
        if (!event.isPrimary || (event.pointerType === "mouse" && event.button !== 0)) return;
        if (event.target.closest("button, input, textarea, .app-view, .control-center")) return;
        swipeStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
        event.currentTarget.setPointerCapture(event.pointerId);
      }
      function endGesture(event) {
        if (!swipeStart || event.pointerId !== swipeStart.pointerId) return;
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.abs(dx) >= 48 && Math.abs(dx) > Math.abs(dy) * 1.2 && unlocked && homeScreen.classList.contains("active") && !appView.classList.contains("open") && !controlCenter.classList.contains("open")) {
          setHomePage(homePageIndex + (dx < 0 ? 1 : -1));
          return;
        }
        if (Math.abs(dy) < 48 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
        if (dy < 0 && !unlocked) unlock();
        else if (dy < 0 && appView.classList.contains("open")) goHome();
        else if (dy < 0 && controlCenter.classList.contains("open")) controlCenter.classList.remove("open");
        else if (dy > 0 && unlocked && !appView.classList.contains("open") && !controlCenter.classList.contains("open")) controlCenter.classList.add("open");
      }
      $("#screen").addEventListener("pointerdown", startGesture);
      $("#screen").addEventListener("pointerup", endGesture);
      $("#screen").addEventListener("pointercancel", endGesture);
      lockScreen.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        unlock();
      });
      $("#homeIndicator").addEventListener("click", goHome);
      document.querySelectorAll(".page-dot").forEach((dot) => dot.addEventListener("click", () => setHomePage(Number(dot.dataset.page))));
      $("#island").addEventListener("click", () => $("#island").classList.toggle("expanded"));
      $("#fullscreenToggle").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) {
          console.error("Unable to toggle fullscreen mode.", error);
          $("#fullscreenToggle").title = "全屏不可用；可以按 F11 切换浏览器全屏";
        }

        if (button && button.getAttribute("aria-label")) button.classList.toggle("on");
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" || event.key === "Backspace") {
          if (appView.classList.contains("open")) closeApp();
          else if (controlCenter.classList.contains("open")) controlCenter.classList.remove("open");
        }
        if (event.key === " " && !appView.classList.contains("open")) {
          event.preventDefault();
          unlocked ? goHome() : unlock();
        }
      });
    })();
